name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 7 minutes to keep the Render free-tier instance warm and prevent spin-down
    - cron: '*/7 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SkillSync Render Instance
        run: |
          echo "Pinging SkillSync Render backend..."
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://skillsync-5wgx.onrender.com/v3/api-docs)
          echo "Response code from /v3/api-docs: $RESPONSE_CODE"
          
          if [ "$RESPONSE_CODE" -eq 200 ] || [ "$RESPONSE_CODE" -eq 301 ] || [ "$RESPONSE_CODE" -eq 302 ]; then
            echo "Render backend is warm and healthy! (HTTP $RESPONSE_CODE)"
          else
            echo "Warning: Received HTTP $RESPONSE_CODE, pinging swagger-ui fallback..."
            curl -s -o /dev/null -w "%{http_code}" https://skillsync-5wgx.onrender.com/swagger-ui.html
          fi
